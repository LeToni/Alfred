name: Finance Frontend Test

on:
  push:
    branches: [ main ]
    paths:
      - 'finance-app/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'finance-app/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'finance-app/package-lock.json'

      - name: Install dependencies
        working-directory: ./finance-app
        run: npm ci

      - name: Run tests
        working-directory: ./finance-app
        run: npm test

      - name: Build application
        working-directory: ./finance-app
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: finance-app/coverage/
          retention-days: 30
